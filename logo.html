<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<style>
  body {
    background: #000; /* Хар фон */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .logo-box {
    border: 2px solid #fff;        /* Нимгэн цагаан хүрээ */
    border-radius: 8px;            /* 6–8px дугуй булан */
    padding: 12px 20px;            /* Дотор зай */
    display: inline-block;
  }

  .logo-text {
    color: #fff;                   /* Цагаан текст */
    font-family: "Inter", sans-serif;
    font-weight: 700;              /* Bold */
    font-size: 32px;               /* Апп логоны хэмжээ */
    letter-spacing: 1px;           /* Жижиг зай */
    text-align: center;            /* Төвд байрласан */
  }
</style>
</head>
<body>

<div class="logo-box">
  <div class="logo-text">TRAVELMAP.mn</div>
</div>

</body>
</html>
