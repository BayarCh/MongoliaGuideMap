<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>TravelMap.mn Icon - Dark</title>
<style>
  body {
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .icon {
    width: 512px;
    height: 512px;
    background: #000;
    border-radius: 20%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .logo-box {
    border: 2px solid #fff;
    border-radius: 8px;
    padding: 18px 32px;
    text-align: center;
  }

  .logo-main {
    color: #fff;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 48px;
    letter-spacing: 1px;
  }

  .logo-sub {
    color: #fff;
    font-family: "Inter", sans-serif;
    font-weight: 300;
    font-size: 22px;
    margin-top: 6px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="icon">
  <div class="logo-box">
    <div class="logo-main">TRAVELMAP.mn</div>
    <div class="logo-sub">MONGOLIA</div>
  </div>
</div>

</body>
</html>
